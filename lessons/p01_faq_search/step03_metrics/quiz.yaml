- q: recall@3 برابر ۱ برای یک سؤال یعنی چه؟
  options: ["سند درست رتبه‌ی اول است", "سند درست در سه نتیجه‌ی اول هست", "سه سند درست پیدا شده"]
  answer: 1
  why: recall@k فقط می‌پرسد «در k تای اول هست؟»؛ جایگاه دقیق را MRR می‌سنجد.
- q: چرا MRR کنار recall لازم است؟
  options: ["چون recall غلط است", "چون recall جایگاه سند درست را نشان نمی‌دهد", "چون MRR سریع‌تر محاسبه می‌شود"]
  answer: 1
  why: سند درست در رتبه‌ی ۱ و رتبه‌ی ۳ هر دو recall@3 برابر ۱ دارند ولی MRR تفاوت را نشان می‌دهد.
- q: چرا سؤال‌های ارزیابی را از جمله‌های خود سند نمی‌سازیم؟
  options: ["چون خیلی کوتاه‌اند", "چون کلمه‌ها با سند یکی است و BM25 را بیش از حد خوش‌بین نشان می‌دهد", "چون فرمت CSV خراب می‌شود"]
  answer: 1
  why: کاربر واقعی با کلمه‌های دیگر می‌پرسد؛ ارزیابی باید همان را بسنجد.
