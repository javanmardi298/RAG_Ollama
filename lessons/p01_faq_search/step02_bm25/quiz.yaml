- q: چرا کلمه‌ی نادر در BM25 وزن بیشتری دارد؟
  options: ["چون کوتاه‌تر است", "چون فقط در چند سند آمده و پس سند را بهتر از بقیه جدا می‌کند", "چون در فرمول tf بزرگ‌تر است"]
  answer: 1
  why: idf کلمه‌هایی را که همه‌جا هستند (the، within) کم‌ارزش می‌کند و کلمه‌های متمایزکننده (warranty) را پر ارزش.
- q: BM25 با query «couch» سندی که فقط «sofa» دارد را پیدا می‌کند؟
  options: ["بله، چون معنا را می‌فهمد", "نه، چون فقط تطبیق دقیق کلمه را می‌بیند", "فقط اگر k1 بزرگ باشد"]
  answer: 1
  why: BM25 روی کلمه‌های یکسان کار می‌کند؛ هم‌معنایی نیاز به embedding دارد.
- q: پارامتر b چه کاری می‌کند؟
  options: ["شدت نرمال‌سازی طول سند", "تعداد نتایج", "وزن کلمه‌های نادر"]
  answer: 0
  why: b=0 یعنی طول سند مهم نیست، b=1 یعنی کاملاً نرمال می‌شود (معمولاً 0.75).
