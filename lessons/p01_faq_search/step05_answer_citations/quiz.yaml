- q: چرا وقتی هیچ تکه‌ای پیدا نشد مدل را صدا نمی‌زنیم؟
  options: ["چون مدل بدون متن کار نمی‌کند", "هم هزینه‌ی بیهوده نیست و هم مدل بدون شاهد ممکن است از خودش جواب بسازد", "چون کد کوتاه‌تر می‌شود"]
  answer: 1
  why: امتناع در کد قطعی و ارزان است؛ جواب بدون شاهد ریسک hallucination دارد.
- q: چرا ارجاع‌های داخل جواب مدل را با شناسه‌های واقعی مقایسه می‌کنیم؟
  options: ["مدل ممکن است منبع ساختگی بنویسد", "برای سرعت بیشتر", "چون قالب کروشه خراب می‌شود"]
  answer: 0
  why: مدل می‌تواند شناسه‌ی قابل‌باور ولی ساختگی بنویسد؛ فقط شناسه‌ی تکه‌هایی که فرستادیم معتبر است.
- q: ارجاع معتبر چه چیزی را تضمین نمی‌کند؟
  options: ["اینکه منبع وجود دارد", "اینکه جمله‌ی مدل واقعاً با آن منبع سازگار است", "اینکه جواب خالی نیست"]
  answer: 1
  why: مدل می‌تواند به منبع درست اشاره کند و چیز دیگری بگوید؛ برای آن به راستی‌آزمایی (verify) نیاز است.
