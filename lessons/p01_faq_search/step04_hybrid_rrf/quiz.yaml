- q: چرا RRF از رتبه استفاده می‌کند و نه امتیاز خام؟
  options: ["چون رتبه دقیق‌تر است", "چون امتیاز روش‌ها هم‌مقیاس نیست و رتبه بدون تنظیم قابل ترکیب است", "چون امتیاز را نمی‌شود ذخیره کرد"]
  answer: 1
  why: BM25 و Jaccard اعداد در مقیاس‌های متفاوت می‌دهند؛ رتبه مقایسه‌پذیر است.
- q: سه‌حرفی (trigram) چه مشکلی از BM25 را حل می‌کند؟
  options: ["هم‌معنایی", "غلط املایی کوچک", "جست‌وجوی چندزبانه"]
  answer: 1
  why: یک غلط املایی فقط چند سه‌حرفی را خراب می‌کند و بقیه هنوز مشترک‌اند؛ معنا را نمی‌فهمد.
- q: آیا ترکیب (hybrid) همیشه از هر دو روش تکی بهتر است؟
  options: ["بله همیشه", "نه، باید با معیار گام ۳ سنجید", "فقط اگر k=60 باشد"]
  answer: 1
  why: ترکیب رتبه‌ها یک روش ضعیف را هم وارد می‌کند؛ بدون اندازه‌گیری نمی‌شود فهمید.
