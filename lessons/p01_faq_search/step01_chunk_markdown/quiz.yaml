- q: چرا کل سند را به مدل زبانی نمی‌دهیم و آن را chunk می‌کنیم؟
  options: ["چون مدل‌ها فقط متن کوتاه را می‌فهمند", "هزینه و زمان کمتر، گمراه نشدن مدل و امکان ارجاع به منبع", "چون chunk کردن دقت را همیشه ۱۰۰٪ می‌کند"]
  answer: 1
  why: هر توکن هزینه و تأخیر دارد، اطلاعات نامرتبط مدل را منحرف می‌کند و بدون chunk نمی‌شود گفت جواب از کدام بخش است.
- q: چرا عنوان کامل (Returns > Return window) را کنار هر تکه نگه می‌داریم؟
  options: ["برای زیبایی خروجی", "تا زمینه‌ی تکه گم نشود", "چون BM25 بدون عنوان کار نمی‌کند"]
  answer: 1
  why: جمله‌ی «۳۰ روز» بدون زمینه نامشخص است؛ عنوان می‌گوید درباره‌ی بازگشت کالاست.
- q: اگر تکه‌ها خیلی کوچک باشند چه اتفاقی می‌افتد؟
  options: ["جست‌وجو سریع‌تر و دقیق‌تر می‌شود", "زمینه گم می‌شود و جواب کامل در یک تکه نیست", "هیچ تغییری نمی‌کند"]
  answer: 1
  why: تکه‌ی بسیار کوچک ممکن است بخشی از جواب را داشته باشد و بدون جمله‌های کناری معنا نداشته باشد.
