- q: چرا خطای تنظیم باید قبل از شروع اجرا گرفته شود؟
  options: ["تا کد کوتاه‌تر شود", "تا بیست دقیقه اجرای طولانی با کلید یا مدل غلط هدر نرود", "چون Python اجبار می‌کند"]
  answer: 1
  why: اعتبارسنجی زودهنگام (fail fast) وقت و هزینه را حفظ می‌کند.
- q: چرا مقدار کلید API را در پیام خطا یا لاگ نمی‌نویسیم؟
  options: ["چون طولانی است", "چون لاگ‌ها کپی و منتشر می‌شوند و کلید لو می‌رود", "چون کلید تغییر می‌کند"]
  answer: 1
  why: فقط وجود کلید را چک کن؛ اگر لو رفت باید باطلش کنی.
- q: فلگ cloud برای چه به درد می‌خورد؟
  options: ["برای نمایش رنگی", "تا قبل از فرستادن داده هشدار حریم خصوصی و سقف هزینه را فعال کنیم", "برای انتخاب سریع‌تر مدل"]
  answer: 1
  why: ارائه‌دهنده‌ی ابری یعنی داده از دستگاه بیرون می‌رود و هزینه دارد.
