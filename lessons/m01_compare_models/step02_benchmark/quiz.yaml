- q: چرا خطای یک مدل را به‌عنوان «غلط» می‌شماریم و آزمون را قطع نمی‌کنیم؟
  options: ["تا آزمون سریع‌تر شود", "تا یک ارائه‌دهنده‌ی ناپایدار بقیه‌ی مقایسه را خراب نکند و ناپایداری‌اش دیده شود", "چون Python این را می‌خواهد"]
  answer: 1
  why: قابلیت اطمینان خودش بخشی از کیفیت یک ارائه‌دهنده است.
- q: ۱۰ مورد آزمون و اختلاف ۱۰٪ بین دو مدل یعنی چه؟
  options: ["مدل اول قطعاً بهتر است", "فقط یک مورد فرق دارد؛ نتیجه‌ی قطعی نیست", "هر دو برابرند"]
  answer: 1
  why: نمونه‌ی کوچک نوسان زیاد دارد؛ مقایسه‌ی جدی ۳۰ تا ۱۰۰ مورد از داده‌ی خودت می‌خواهد.
- q: چرا تأخیر اولین فراخوانی Ollama را نباید در میانگین بیاوری؟
  options: ["چون خطا دارد", "چون بار کردن مدل در حافظه را هم شامل می‌شود و نماینده‌ی حالت معمول نیست", "چون خیلی کوتاه است"]
  answer: 1
  why: warm-up یک‌بار است؛ تأخیر پایدار را باید سنجید.
