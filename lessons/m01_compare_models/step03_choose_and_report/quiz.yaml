- q: چرا معیار انتخاب مدل را قبل از دیدن نتیجه می‌نویسیم؟
  options: ["تا کد ساده‌تر شود", "تا بعد از دیدن عددها معیار را به نفع مدل دلخواه تنظیم نکنیم", "چون ابزارها اجبار می‌کنند"]
  answer: 1
  why: تنظیم معیار بعد از نتیجه نوعی تقلب ناخواسته است و نتیجه را بی‌اعتبار می‌کند.
- q: اگر هیچ مدلی معیار را برآورده نکرد چه کنیم؟
  options: ["آستانه را پایین بیاوریم تا یکی برنده شود", "مدل بهتر بگیریم یا کار/prompt را اصلاح کنیم و دوباره بسنجیم", "رندوم انتخاب کنیم"]
  answer: 1
  why: پایین آوردن آستانه یعنی قبول مدلی که کار را درست انجام نمی‌دهد.
- q: چرا تاریخ و نسخه‌ی آزمون را کنار مدل برنده ثبت می‌کنیم؟
  options: ["برای زیبایی", "مدل‌ها و قیمت‌ها عوض می‌شوند و نتیجه فقط برای همان زمان معتبر است", "چون git لازم دارد"]
  answer: 1
  why: تصمیم باید قابل بازبینی و تکرار باشد.
