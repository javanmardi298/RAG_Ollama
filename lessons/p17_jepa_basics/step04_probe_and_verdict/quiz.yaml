- q: چرا encoder تصادفی (آموزش‌ندیده) را هم در جدول می‌گذاریم؟
  options: ["تا نشان دهیم آموزش چقدر واقعاً اضافه کرده", "چون سریع است", "چون پیکسل خام را ندارد"]
  answer: 0
  why: معماری تصادفی هم ویژگی‌های مفید می‌دهد؛ ارزش آموزش فاصله از همین baseline است.
- q: نتیجه‌ی یک seed چه ایرادی دارد؟
  options: ["تصادفی است؛ SIGReg در آزمایش ما بین ۰٫۶۹ و ۰٫۹۳ نوسان داشت", "هیچ ایرادی ندارد", "فقط کند است"]
  answer: 0
  why: بدون چند seed و بازه، نمی‌دانی تفاوت واقعی است یا نوسان تصادفی.
- q: چرا روی ارقام ۸×۸ پیکسل خام برنده است ولی این شکست JEPA نیست؟
  options: ["چون JEPA غلط است", "داده کوچک و ساده است؛ مزیت JEPA در داده‌ی بزرگ پرجزئیات و world model ظاهر می‌شود", "چون probe خطی ضعیف است"]
  answer: 1
  why: ادعای «JEPA همیشه بهتر است» نادرست است؛ حکم باید به شرایط آزمایش وابسته گزارش شود.
