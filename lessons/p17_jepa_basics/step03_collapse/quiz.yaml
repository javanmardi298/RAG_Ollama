- q: loss برابر تقریباً صفر و mean_std نزدیک صفر یعنی چه؟
  options: ["مدل عالی یاد گرفته", "collapse: همه‌ی ورودی‌ها یک embedding دارند", "داده‌ی آموزش کم است"]
  answer: 1
  why: پیش‌بینی ثابت همیشه درست است؛ loss صفر می‌شود ولی نمایش اطلاعاتی ندارد.
- q: آیا رتبه‌ی مؤثر پایین همیشه یعنی collapse؟
  options: ["بله", "نه، اگر داده‌ی واقعی ذاتاً کم‌بعد باشد (مثل دنیای دو‌بعدی) رتبه‌ی کم سالم است", "فقط اگر dim بزرگ باشد"]
  answer: 1
  why: رتبه را با ساختار واقعی داده و با نشانه‌هایی مثل loss≈0 و mean_std≈0 تفسیر کن.
- q: چرا probe خطی با StandardScaler ممکن است collapse را پنهان کند؟
  options: ["چون scaler تفاوت‌های بسیار ریز را بزرگ می‌کند", "چون probe کند است", "چون scaler داده را حذف می‌کند"]
  answer: 0
  why: تفاوت‌های ریز بعد از استانداردسازی بزرگ می‌شوند و دقت قابل‌قبول می‌دهند؛ پس خود پراکندگی را هم گزارش کن.
