- q: چرا I-JEPA یک بلوک مجاور را پنهان می‌کند و patch های پراکنده را نه؟
  options: ["چون پیاده‌سازی ساده‌تر است", "با patch های پراکنده مدل می‌تواند همسایه را کپی کند و ساختار معنایی یاد نمی‌گیرد", "چون تصویر کوچک است"]
  answer: 1
  why: بلوک مجاور حدس زدن را سخت‌تر و معنادارتر می‌کند؛ مدل باید شکل و ساختار را بفهمد.
- q: در keep، مقدار True یعنی چه؟
  options: ["patch پنهان است", "patch برای encoder دیده می‌شود (زمینه)", "patch خراب است"]
  answer: 1
  why: keep = visible؛ patch های پنهان (False) هدف پیش‌بینی‌اند.
- q: اگر ترتیب patch ها را عوض کنیم ولی embedding موقعیتی را نه چه می‌شود؟
  options: ["هیچ", "موقعیت‌ها با محتوا نمی‌خوانند و مدل خراب می‌شود", "سرعت بیشتر می‌شود"]
  answer: 1
  why: embedding موقعیتی فرض می‌کند patch i در خانه‌ی i است.
