- q: چرا loss فقط روی patch های پنهان حساب می‌شود؟
  options: ["چون patch های دیده‌شده خطا ندارند", "هدف پیش‌بینی بخش پنهان از روی بخش دیده‌شده است؛ دیده‌شده‌ها را فقط کپی می‌کرد", "برای سرعت بیشتر فقط"]
  answer: 1
  why: اگر دیده‌شده‌ها هم در loss باشند، مدل با کپی کردن ورودی loss را کم می‌کند و چیزی یاد نمی‌گیرد.
- q: EMA معلم چه کمکی می‌کند؟
  options: ["هدف ثابت‌تر و بدون گرادیان می‌دهد و جلوی collapse را می‌گیرد", "دقت را همیشه ۱۰۰٪ می‌کند", "حافظه را کم می‌کند"]
  answer: 0
  why: هدف از کپی کند‌تغییر encoder می‌آید و گرادیان نمی‌گیرد؛ پس راه میان‌بر «همه چیز ثابت» را سخت می‌کند.
- q: اگر m=0.5 بگذاریم معلم چه می‌شود؟
  options: ["تقریباً دانش‌آموز را دنبال می‌کند و ثبات را از دست می‌دهد", "خیلی کند عوض می‌شود", "هیچ فرقی نمی‌کند"]
  answer: 0
  why: m کوچک یعنی معلم تقریباً کپی لحظه‌ای دانش‌آموز است و مزیت ثبات از بین می‌رود.
