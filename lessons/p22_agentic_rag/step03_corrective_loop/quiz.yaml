- q: چرا حلقه‌ی بازنویسی باید سقف دور داشته باشد؟
  options: ["چون Python حلقه‌ی بی‌نهایت را نمی‌پذیرد", "هزینه و تأخیر بی‌نهایت می‌شود و ممکن است هرگز تمام نشود", "برای زیبایی کد"]
  answer: 1
  why: هر دور جست‌وجو (و در نسخه‌ی مدل، فراخوانی LLM) هزینه دارد؛ سقف تضمین می‌کند سیستم همیشه تمام می‌شود.
- q: grade بعد از بازنویسی با کدام متن انجام می‌شود؟
  options: ["query بازنویسی‌شده", "سؤال اصلی کاربر", "هر دو"]
  answer: 1
  why: بازنویسی ممکن است معنا را عوض کند؛ مرتبط بودن باید نسبت به خواسته‌ی اصلی سنجیده شود.
- q: وقتی rewrite لیست خالی برمی‌گرداند چه باید کرد؟
  options: ["همان query را دوباره بفرست", "حلقه را متوقف کن", "سقف دور را زیاد کن"]
  answer: 1
  why: ایده‌ای نمانده؛ ادامه‌دادن فقط هزینه است.
