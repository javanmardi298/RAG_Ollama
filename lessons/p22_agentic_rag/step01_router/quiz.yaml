- q: چرا برای «hello» جست‌وجو نمی‌کنیم؟
  options: ["چون جست‌وجو کند است", "هزینه‌ی بیهوده دارد و تکه‌ی نامرتبط ممکن است جواب را منحرف کند", "چون سلام سند ندارد"]
  answer: 1
  why: جست‌وجو همیشه چیزی برمی‌گرداند؛ مدل ممکن است از آن جواب بی‌ربط بسازد.
- q: در تردید بین direct و retrieve کدام امن‌تر است؟
  options: ["direct", "retrieve", "فرقی ندارد"]
  answer: 1
  why: جواب بدون شاهد خطرناک‌تر از یک جست‌وجوی اضافی است.
- q: چرا مسیریاب قاعده‌ای را با مدل زبانی جایگزین می‌کنیم؟
  options: ["وقتی قاعده‌ها سؤال‌های واقعی را درست جدا نمی‌کنند و اندازه‌گیری این را نشان می‌دهد", "همیشه، چون مدل بهتر است", "هرگز"]
  answer: 0
  why: اول baseline ساده و اندازه‌گیری؛ مدل فقط وقتی که خطای قاعده‌ها مشخص شد.
