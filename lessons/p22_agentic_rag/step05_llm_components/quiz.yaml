- q: چرا مدل را فقط از طریق llm.chat و llm.json صدا می‌زنیم؟
  options: ["برای زیبایی", "تا ارائه‌دهنده (Ollama، Claude، OpenCode) با یک تنظیم عوض شود و تست‌ها بدون مدل واقعی اجرا شوند", "چون API های دیگر وجود ندارند"]
  answer: 1
  why: یک رابط ثابت وابستگی به یک ارائه‌دهنده را حذف می‌کند و مدل ساختگی برای تست ممکن می‌شود.
- q: وقتی همان مدل هم جواب می‌دهد و هم verify می‌کند چه خطری هست؟
  options: ["خطاها همبسته‌اند و مدل اشتباه خودش را تأیید می‌کند", "هیچ خطری نیست", "فقط هزینه بالا می‌رود"]
  answer: 0
  why: قاضی و بازیگر یکی‌اند؛ مدل جداگانه یا قوی‌تر و سنجش با برچسب انسانی لازم است.
- q: چرا مقایسه‌ی عامل قاعده‌ای با عامل مدلی لازم است؟
  options: ["چون مدل همیشه بهتر است", "تا ببینیم کدام خطاها واقعاً کم شد و بهای آن (هزینه، زمان) چقدر بود", "برای کوتاه شدن کد"]
  answer: 1
  why: مدل بزرگ‌تر همیشه بهتر نیست؛ تصمیم باید روی عدد باشد.
