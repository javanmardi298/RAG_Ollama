- q: کدام خطا برای یک عامل پشتیبانی خطرناک‌تر است؟
  options: ["امتناع به سؤالی که جواب داشت", "جواب دادن به سؤالی که جواب نداشت", "هر دو دقیقاً یکسان‌اند"]
  answer: 1
  why: جواب ساختگی اعتماد و حتی پول را از بین می‌برد؛ امتناع بد است ولی قابل جبران (ارجاع به انسان). با این حال هر دو را باید شمرد.
- q: چرا verify فقط با همپوشانی کلمه کافی نیست؟
  options: ["عدد یا نفی را می‌تواند تغییر دهد (30 ← 90، can ← cannot)", "چون کند است", "چون کلمه‌ها را حذف می‌کند"]
  answer: 0
  why: همپوشانی کلمه معنا نیست؛ برای عددها بررسی دقیق و برای معنا verify با مدل یا استنتاج لازم است.
- q: چرا ارجاع‌های خروجی مدل را با شناسه‌ی تکه‌های واقعی فیلتر می‌کنیم؟
  options: ["برای کوتاه‌تر شدن جواب", "مدل ممکن است منبع ساختگی بنویسد", "چون شناسه‌ها تغییر می‌کنند"]
  answer: 1
  why: ارجاع قابل‌اعتماد فقط وقتی معنا دارد که به چیزی که واقعاً به مدل داده شد اشاره کند.
