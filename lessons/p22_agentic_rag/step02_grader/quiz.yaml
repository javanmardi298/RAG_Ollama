- q: چرا بعد از جست‌وجو باید تکه‌ها را نمره بدهیم؟
  options: ["چون جست‌وجو همیشه k نتیجه برمی‌گرداند حتی اگر هیچ‌کدام درست نباشد", "چون جست‌وجو تکه‌ها را خراب می‌کند", "برای کم کردن تعداد توکن‌ها فقط"]
  answer: 0
  why: بدون نمره‌دهی، تکه‌ی تصادفی با یک کلمه‌ی مشترک می‌تواند جواب غلط بسازد.
- q: چرا آستانه را نسبت (حداقل نصف کلمه‌های سؤال) گرفتیم و نه عدد ثابت؟
  options: ["تا با طول سؤال تنظیم شود و سؤال کوتاه همیشه رد نشود", "برای سرعت", "چون ۲ عدد جادویی است"]
  answer: 0
  why: عدد ثابت ۲ سؤال تک‌کلمه‌ای را همیشه رد می‌کند و برای سؤال بلند سهل‌گیر است.
- q: grader بسیار سخت‌گیر چه خطایی می‌سازد؟
  options: ["جواب غلط با اطمینان", "امتناع اشتباه (نمی‌داند در حالی که شاهد بود)", "هیچ خطایی"]
  answer: 1
  why: شواهد درست را دور می‌ریزد؛ سهل‌گیری برعکس، جواب غلط می‌سازد. هر دو را باید شمرد.
