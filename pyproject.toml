[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support"
version = "0.0.1"
description = "Marketplace support agent: intents, policy RAG, tools, handoff decisions and evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"support.panel" = ["static/*", "roadmap_template.html", "templates/*/*", "templates/*/*/*"]
