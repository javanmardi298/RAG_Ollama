# Building blocks the project presets need, and where each one lives.
#   ready     already in this repository (support/ or the panel), tested
#   labkit    added in src/labkit/ for the presets, tested
#   external  use a well-known tool; the preset says which and why (not re-implemented here)
components:
  # ---------- data and documents ----------
  doc_loaders:        {name: "خواندن سند (txt/md/html/pdf/docx)", category: data, status: labkit, where: labkit.loaders}
  ocr:                {name: "OCR برای اسکن و عکس", category: data, status: external, where: "Tesseract / docTR / PaddleOCR"}
  table_extraction:   {name: "استخراج جدول از PDF", category: data, status: external, where: "pdfplumber / Camelot / Docling"}
  leakage_free_split: {name: "تقسیم بدون نشت (group split)", category: data, status: ready, where: support.data}
  synthetic_data:     {name: "داده‌ی ساختگی با موارد مرزی", category: data, status: ready, where: support.orders}
  # ---------- retrieval ----------
  chunking:           {name: "chunking (fixed / recursive / heading)", category: retrieval, status: labkit, where: labkit.chunking}
  code_chunking:      {name: "chunking کد با AST", category: retrieval, status: labkit, where: labkit.chunking.python_code}
  bm25:               {name: "BM25", category: retrieval, status: ready, where: support.rag.BM25}
  dense:              {name: "dense retrieval (embedding)", category: retrieval, status: ready, where: labkit.retrieval.Index}
  hybrid_rrf:         {name: "hybrid با RRF", category: retrieval, status: ready, where: support.rag.rrf}
  metadata_filter:    {name: "فیلتر metadata (زبان، دسترسی، تاریخ)", category: retrieval, status: labkit, where: labkit.retrieval.Index.search}
  reranker:           {name: "reranker (cross-encoder)", category: retrieval, status: labkit, where: labkit.retrieval.Index.search}
  mmr:                {name: "MMR (تنوع نتایج)", category: retrieval, status: labkit, where: labkit.retrieval.Index._mmr}
  query_rewriting:    {name: "بازنویسی query / multi-query", category: retrieval, status: labkit, where: labkit.retrieval.multi_query_search}
  vector_db:          {name: "پایگاه برداری", category: retrieval, status: external, where: "FAISS (محلی) / Qdrant / pgvector"}
  knowledge_graph:    {name: "گراف دانش (triples، multi-hop)", category: retrieval, status: labkit, where: labkit.graph}
  # ---------- generation and grounding ----------
  citations:          {name: "جواب با ارجاع به منبع", category: generation, status: ready, where: support.rag.answer_question}
  grounding_check:    {name: "بررسی عدد/ادعای ساختگی", category: generation, status: ready, where: support.guardrails.check_output}
  structured_output:  {name: "خروجی ساختاریافته + اعتبارسنجی + repair", category: generation, status: labkit, where: labkit.structured}
  prompt_registry:    {name: "نسخه‌گذاری prompt", category: generation, status: labkit, where: labkit.ops.PromptRegistry}
  # ---------- classification and decisions ----------
  intent_classifier:  {name: "طبقه‌بند intent (TF-IDF / embedding / LLM)", category: decision, status: ready, where: support.intents}
  calibration:        {name: "calibration (temperature scaling، ECE)", category: decision, status: ready, where: support.intents}
  selective_decision: {name: "آستانه‌ی ریسک و ارجاع به انسان", category: decision, status: ready, where: support.decision}
  # ---------- agents and workflows ----------
  tool_agent:         {name: "agent با tool calling", category: agent, status: ready, where: support.agent}
  confirmation:       {name: "تأیید صریح قبل از عمل", category: agent, status: ready, where: support.agent}
  idempotency:        {name: "idempotency عمل‌ها", category: agent, status: ready, where: "support.tools / labkit.workflow"}
  langgraph:          {name: "گراف حالت LangGraph + checkpointer", category: agent, status: ready, where: support.lc.graph}
  workflow_engine:    {name: "موتور workflow (retry، resume، audit)", category: agent, status: labkit, where: labkit.workflow}
  human_approval:     {name: "تأیید انسانی در workflow", category: agent, status: labkit, where: labkit.workflow}
  memory:             {name: "حافظه‌ی گفتگو (خلاصه + facts)", category: agent, status: labkit, where: labkit.memory}
  sql_guard:          {name: "محافظ Text-to-SQL", category: agent, status: labkit, where: labkit.sqlguard}
  web_search:         {name: "ابزار جستجوی وب", category: agent, status: external, where: "SearXNG (محلی) / Tavily / Brave Search API"}
  sandbox_exec:       {name: "اجرای کد در sandbox", category: agent, status: external, where: "Docker با شبکه‌ی بسته / E2B"}
  multi_agent:        {name: "supervisor و agentهای متخصص", category: agent, status: external, where: "LangGraph supervisor (روی support.lc بساز)"}
  mcp:                {name: "ابزارها از طریق MCP", category: agent, status: ready, where: support.panel.mcp_server}
  # ---------- safety ----------
  input_guardrails:   {name: "guardrail ورودی (injection، red flags)", category: safety, status: ready, where: support.guardrails.check_input}
  pii_masking:        {name: "پنهان کردن PII", category: safety, status: ready, where: support.guardrails.mask_pii}
  redteam_set:        {name: "مجموعه‌ی red-team", category: safety, status: ready, where: eval/redteam.yaml}
  safety_classifier:  {name: "classifier امنیتی LLM", category: safety, status: external, where: "Llama Guard / ShieldGemma روی Ollama"}
  attack_scanner:     {name: "اسکنر حمله‌ی خودکار", category: safety, status: external, where: "garak / PyRIT"}
  # ---------- evaluation ----------
  retrieval_metrics:  {name: "recall@k، MRR، nDCG", category: eval, status: labkit, where: labkit.metrics}
  extraction_metrics: {name: "F1 هر فیلد، exact match", category: eval, status: labkit, where: labkit.metrics}
  sql_exec_accuracy:  {name: "execution accuracy برای SQL", category: eval, status: labkit, where: labkit.sqlguard.execution_match}
  sim_user_eval:      {name: "ارزیابی با کاربر شبیه‌سازی‌شده", category: eval, status: ready, where: support.evaluation}
  bootstrap_ci:       {name: "فاصله‌ی اطمینان bootstrap", category: eval, status: ready, where: support.evaluation}
  llm_judge:          {name: "LLM judge اعتبارسنجی‌شده (kappa)", category: eval, status: ready, where: support.evaluation}
  run_registry:       {name: "ثبت اجرا و مقایسه", category: eval, status: ready, where: support.panel.registry}
  # ---------- production ----------
  serving:            {name: "سرو با FastAPI + Docker", category: production, status: ready, where: app/main.py}
  loadtest:           {name: "load test و p95", category: production, status: ready, where: scripts/loadtest.py}
  drift:              {name: "drift با PSI", category: production, status: ready, where: support.monitoring}
  cache:              {name: "کش پاسخ", category: production, status: labkit, where: labkit.ops.Cache}
  cost_ledger:        {name: "ثبت توکن، هزینه و تأخیر", category: production, status: labkit, where: labkit.ops.Ledger}
  model_router:       {name: "router مدل ارزان ← قوی", category: production, status: labkit, where: labkit.ops.Router}
  tracing:            {name: "tracing", category: production, status: external, where: "OpenTelemetry / Langfuse (محلی) / LangSmith"}
  streaming:          {name: "پاسخ stream (SSE)", category: production, status: external, where: "FastAPI StreamingResponse (app/main_lc.py نمونه دارد)"}
  auth_ratelimit:     {name: "احراز هویت و rate limit", category: production, status: external, where: "FastAPI middleware / API gateway"}
  ci_eval:            {name: "ارزیابی در CI", category: production, status: ready, where: .github/workflows/tests.yml}
  # ---------- experiments and training ----------
  ab_testing:         {name: "A/B با SRM و guardrail", category: ml, status: ready, where: support.experiments}
  lora:               {name: "fine-tune با LoRA", category: ml, status: ready, where: scripts/stage9_lora_colab.py}
  dpo:                {name: "preference tuning (DPO)", category: ml, status: external, where: "Hugging Face TRL"}
  distillation:       {name: "distillation از LLM به مدل کوچک", category: ml, status: external, where: "برچسب‌زنی با LLM + LoRA (همین repo)"}
  # ---------- 2026 research additions (docs/research_2026.md) ----------
  agentic_rag:        {name: "Agentic RAG (route → grade → rewrite → verify → abstain)", category: retrieval, status: labkit, where: labkit.agentic_rag.AgenticRAG}
  contextual_retrieval: {name: "contextual retrieval (جمله‌ی زمینه برای هر chunk)", category: retrieval, status: labkit, where: labkit.contextual.contextualize}
  late_interaction:   {name: "late interaction / ColPali (RAG روی تصویر صفحه)", category: retrieval, status: external, where: "ColPali / ColQwen + byaldi یا Vespa / Qdrant multivector"}
  long_context_route: {name: "مسیر long-context در برابر RAG", category: retrieval, status: labkit, where: labkit.agentic_rag.llm_router}
  context_budget:     {name: "مدیریت context (بودجه، prefix پایدار، پاک‌کردن tool result کهنه)", category: generation, status: labkit, where: labkit.context.pack}
  prompt_optimizer:   {name: "بهینه‌سازی prompt (GEPA-style، پارتو + جریمه‌ی طول)", category: generation, status: labkit, where: labkit.optimize.optimize}
  dspy:               {name: "DSPy (برنامه‌نویسی prompt، GEPA/MIPRO)", category: generation, status: external, where: "dspy (pip install dspy)"}
  self_consistency:   {name: "self-consistency و best-of-n", category: generation, status: labkit, where: labkit.reasoning.self_consistency}
  pass_k:             {name: "pass^k (پایایی agent در k اجرا)", category: eval, status: labkit, where: labkit.metrics.reliability_report}
  trajectory_eval:    {name: "ارزیابی مسیر agent (ابزار درست، ترتیب، حالت نهایی DB)", category: eval, status: external, where: "tau-bench style: حالت نهایی DB را با gold مقایسه کن (support.evaluation الگو است)"}
  capability_security: {name: "امنیت با طراحی (CaMeL: provenance + policy در کد)", category: safety, status: labkit, where: labkit.capsec.Policy}
  mcp_server_sdk:     {name: "ساخت MCP server (spec 2026-07-28، stateless)", category: agent, status: ready, where: support.panel.mcp_server}
  a2a:                {name: "A2A v1.0 (Agent Card امضاشده، agent↔agent)", category: agent, status: external, where: "a2a-sdk (Linux Foundation)"}
  agent_skills:       {name: "Agent Skills (SKILL.md، progressive disclosure)", category: agent, status: external, where: "پوشه‌ی skills/ با SKILL.md (Claude Code، Agent SDK و ~۴۰ پلتفرم)"}
  otel_genai:         {name: "OpenTelemetry GenAI semantic conventions", category: production, status: external, where: "opentelemetry-sdk + gen_ai.* attributes (هنوز Development)"}
  grpo_trl:           {name: "RL با پاداش قابل‌بررسی (GRPO / RLVR)", category: ml, status: external, where: "Hugging Face TRL GRPOTrainer / Unsloth"}
  # ---------- JEPA and world models (docs/jepa.md) ----------
  jepa_ssl:           {name: "JEPA: پیش‌بینی embedding بخش پنهان (I-JEPA کوچک)", category: world_model, status: labkit, where: jepa_lab.ssl.train}
  sigreg:             {name: "SIGReg و تشخیص collapse (LeJEPA)", category: world_model, status: labkit, where: jepa_lab.sigreg.sigreg}
  linear_probe:       {name: "linear probe روی encoder منجمد", category: world_model, status: labkit, where: jepa_lab.ssl.linear_probe}
  latent_world_model: {name: "world model نهفته‌ی شرطی به عمل", category: world_model, status: labkit, where: jepa_lab.world_model.train_world_model}
  cem_mpc:            {name: "برنامه‌ریزی CEM + MPC در فضای نهفته", category: world_model, status: labkit, where: jepa_lab.world_model.cem_plan}
  surprise_detection: {name: "surprise = خطای پیش‌بینی (کشف ناهنجاری)", category: world_model, status: labkit, where: jepa_lab.world_model.surprise_auc}
  vjepa2:             {name: "V-JEPA 2 از پیش آموزش‌دیده (ویدیو)", category: world_model, status: external, where: "transformers: facebook/vjepa2-* (scripts/jepa5_vjepa2_colab.py)"}
  pretrained_vision:  {name: "backbone بینایی آماده برای مقایسه", category: world_model, status: external, where: "DINOv2/v3، SigLIP (transformers / timm)"}
