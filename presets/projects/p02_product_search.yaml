id: p02_product_search
order: 2
level: 1
title: "جستجوی محصول در فروشگاه آنلاین"
title_en: "E-commerce product search (WANDS)"
tracks: [rag, eval]
weeks: "2"
real_world: "جستجوی Wayfair، Amazon، Digikala: «میز ناهارخوری چوبی ۶ نفره» باید محصول درست را در صفحه‌ی اول بیاورد."
problem: "query کوتاه و مبهم است، محصول‌ها فیلدهای مختلف دارند (نام، دسته، ویژگی) و ارتباط درجه‌دار است: کاملاً مرتبط، تا حدی مرتبط، نامرتبط."
goal: "یک موتور جستجوی hybrid با فیلدهای وزن‌دار بسازی و با nDCG درجه‌دار ارزیابی کنی."
prerequisites: [p01_faq_search]
data:
  - {name: "WANDS (Wayfair)", url: "https://github.com/wayfair/WANDS", license: "MIT", note: "۴۲هزار محصول، ۴۸۰ query، ۲۳۳هزار برچسب Exact/Partial/Irrelevant"}
stack: {llm: "اختیاری برای query understanding", embeddings: "all-MiniLM-L6-v2 یا e5-base", extras: ["FAISS برای index بزرگ"]}
components: [doc_loaders, bm25, dense, hybrid_rrf, reranker, retrieval_metrics, metadata_filter, vector_db, run_registry]
stages:
  - title: "داده و برچسب درجه‌دار"
    learn: ["relevance درجه‌دار: Exact=2، Partial=1، Irrelevant=0", "چرا nDCG و نه recall برای جستجوی محصول"]
    build: ["product.csv، query.csv، label.csv را بخوان", "متن index: نام + دسته + ویژگی‌ها"]
    measure: "توزیع برچسب‌ها برای هر query"
    pitfall: "محصول‌های بی‌برچسب «نامرتبط» نیستند، فقط دیده نشده‌اند؛ این nDCG را بدبینانه می‌کند."
  - title: "BM25 با فیلدهای وزن‌دار"
    learn: ["BM25F: نام محصول مهم‌تر از توضیحات است"]
    build: ["نام را دو بار در متن index تکرار کن (ساده‌ترین وزن‌دهی) یا دو index با وزن جدا", "nDCG@10 را حساب کن"]
    measure: "nDCG@10 (labkit.metrics.ndcg_at_k)"
    pitfall: "توضیحات طولانی امتیاز BM25 را با نرمال‌سازی طول پایین می‌کشد؛ b را تنظیم کن."
  - title: "dense، hybrid و reranker"
    learn: ["bi-encoder برای بازیابی سریع، cross-encoder برای reranking دقیق", "هزینه‌ی تأخیر reranker"]
    build: ["hybrid را اضافه کن", "cross-encoder ms-marco-MiniLM روی ۵۰ نتیجه‌ی اول"]
    measure: "nDCG@10 و تأخیر p95 هر روش"
    pitfall: "reranker روی کل کاتالوگ اجرا نشود؛ فقط روی candidateهای مرحله‌ی اول."
  - title: "فیلتر و query understanding"
    learn: ["استخراج ویژگی از query (رنگ، جنس، قیمت) و تبدیل به فیلتر", "فیلتر قبل از رتبه‌بندی"]
    build: ["چند الگوی ساده (regex یا LLM با خروجی ساختاریافته) برای رنگ و دسته", "where= در Index.search"]
    measure: "nDCG@10 روی queryهای دارای ویژگی"
    pitfall: "فیلتر سخت با استخراج اشتباه، نتیجه‌ی درست را حذف می‌کند؛ اول به‌صورت boost امتحان کن."
metrics: ["nDCG@10", "MRR", "zero-result rate", "latency p95"]
params: {k: 10, mode: hybrid, rerank_top: 50, bm25_b: 0.75, name_weight: 2}
guardrails: ["queryهای بدون نتیجه را ثبت کن و پیشنهاد جایگزین بده"]
production: ["index افزایشی با تغییر قیمت/موجودی", "A/B روی رتبه‌بندی با معیار conversion، نه فقط nDCG"]
interview: ["nDCG را توضیح بده و چرا برای جستجو مناسب است", "bi-encoder و cross-encoder چه فرقی دارند؟", "فیلتر را قبل یا بعد از رتبه‌بندی اعمال می‌کنی؟"]
advanced: ["learning-to-rank (LightGBM LambdaMART) روی ویژگی‌های BM25/dense/محبوبیت", "personalization", "query autocomplete و اصلاح غلط تایپی"]
cv: "Built hybrid product search on WANDS (42k products) with field weighting and cross-encoder reranking; nDCG@10 {ndcg}."
