id: p01_faq_search
title: ساختن پروژه‌ی جست‌وجوی FAQ با جواب مستند، از صفر در GitHub
repo: faq_search
description: 'FAQ search from scratch: BM25 + typo-tolerant trigram search fused with RRF, evaluated with recall@k / MRR, and LLM answers that cite their sources or abstain'
lede: همه‌ی فایل‌ها را خودت در GitHub می‌سازی، همان کد را روی لپ‌تاپ در VS Code اجرا می‌کنی، و آخر یک repo تمیز با README، تست و CI داری که در رزومه می‌گذاری. هیچ GPU و هیچ مدلی لازم نیست؛ مدل واقعی (Ollama، Claude یا OpenCode) در مرحله‌ی ۱۱ اختیاری است.
learn:
- - درس قدم‌به‌قدم همین پروژه (۵ گام با تمرین)
  - lesson:p01_faq_search
- - 'پروژه در نقشه‌ی راه: مرحله‌ها، سؤال مصاحبه، نسخه‌ی پیشرفته'
  - roadmap:p01_faq_search
lesson: p01_faq_search
fill:
  bm25_recall: '[method=bm25]/recall@3'
  bm25_mrr: '[method=bm25]/mrr'
  trigram_recall: '[method=trigram]/recall@3'
  trigram_mrr: '[method=trigram]/mrr'
  hybrid_recall: '[method=hybrid]/recall@3'
  hybrid_mrr: '[method=hybrid]/mrr'
  recall: '[method=hybrid]/recall@3'
  mrr: '[method=hybrid]/mrr'
facts:
- - GitHub
  - ساختن فایل‌ها، تست خودکار (Actions)
- - VS Code
  - اجرای کد و notebook روی لپ‌تاپ
- - مدل زبانی
  - 'اختیاری: Ollama، Claude یا OpenCode'
flow:
- - GitHub
  - gh
- - VS Code + notebook
  - vs
- - Ollama / Claude / OpenCode
  - ol
steps:
- title: ساختن repo در GitHub
  where:
  - gh
  minutes: 3
  why: 'repo خودت نمونه‌کار توست: هر فایلی که اینجا می‌سازی، کارفرما می‌بیند. اسم و توضیح کوتاه و دقیق، اولین چیزی است که دیده می‌شود.'
  do:
  - در github.com بالا سمت راست **+** → **New repository**.
  - '**Repository name:** `faq_search`'
  - '**Description:** `{description}`'
  - '**Public** را انتخاب کن (برای نمونه‌کار و برای اینکه Actions رایگان باشد).'
  - تیک **Add a README file** را بزن. **Add .gitignore:** None (خودمان می‌سازیم). **Choose a license:** MIT License.
  - '**Create repository**.'
  see: 'repo دو فایل دارد: `README.md` و `LICENSE`. در LICENSE اگر نام تو در خط Copyright نیست، با آیکون مداد اصلاحش کن.'
- title: فایل .gitignore
  where:
  - gh
  minutes: 2
  why: 'به git می‌گوید چه چیزهایی هرگز وارد repo نشوند: محیط مجازی پایتون، فایل‌های موقت، و مهم‌تر از همه `.env` که کلید API در آن است. باید **قبل از** هر فایل دیگری ساخته شود.'
  do:
  - 'در صفحه‌ی repo: **Add file** → **Create new file**، نام: `.gitignore`، متن زیر را paste کن.'
  - '**Commit changes** با پیام `Add .gitignore`.'
  file: .gitignore
- title: فایل requirements.txt
  where:
  - gh
  minutes: 2
  why: 'فهرست بسته‌هایی که پروژه لازم دارد. هسته‌ی پروژه فقط با کتابخانه‌ی استاندارد پایتون کار می‌کند (عمداً: می‌خواهی ببینی جست‌وجو زیر پوشش چطور کار می‌کند)؛ `pytest` برای تست و `ipykernel` برای اینکه VS Code بتواند notebook را با همین محیط اجرا کند.'
  do:
  - '**Add file → Create new file**، نام `requirements.txt`. commit: `Add requirements`.'
  file: requirements.txt
- title: 'فایل داده: data/faq.json'
  where:
  - gh
  minutes: 3
  why: پنج صفحه‌ی FAQ یک فروشگاه (بازگشت کالا، بازپرداخت، ارسال، گارانتی، پرداخت) و ۱۵ سؤال واقعی مشتری با جواب درست. سه سؤال عمداً جواب ندارند تا ببینی سیستم کی باید بگوید «نمی‌دانم». داده ساختگی است و مجوزی لازم ندارد.
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `data/faq.json` (با تایپ `/` خود GitHub پوشه را می‌سازد).'
  - 'متن زیر را paste کن. commit: `Add FAQ data and labelled questions`.'
  file: data/faq.json
- title: 'فایل اصلی: faq_search.py'
  where:
  - gh
  minutes: 5
  why: 'همه‌ی منطق پروژه در یک فایل: تکه‌کردن سند با حفظ عنوان، BM25 از صفر، جست‌وجوی سه‌حرفی (مقاوم به غلط املایی)، ترکیب با RRF، معیارهای recall@k و MRR، و جواب با ارجاع که اگر شاهد نباشد امتناع می‌کند. هر تکه را در درس‌های p01 قدم‌به‌قدم ساخته‌ای؛ اینجا نسخه‌ی تمیز و یکجای آن است.'
  do:
  - '**Add file → Create new file**، نام `faq_search.py`. commit: `Add FAQ search: chunking, BM25, trigram, RRF, metrics, grounded answers`.'
  file: faq_search.py
  note: 'ارائه‌دهنده‌ی مدل در `make_llm` با متغیر محیطی `FAQ_PROVIDER` انتخاب می‌شود: `offline` (پیش‌فرض، بدون مدل)، `ollama`، `anthropic` یا `opencode`.'
  explain:
  - - chunk_markdown
    - سند را در هر عنوان `##` می‌بُرد و عنوان کامل («Returns > Return window») را کنار متن نگه می‌دارد؛ تابع داخلی `flush` بخش جاری را می‌بندد.
    - p01_faq_search/step01_chunk_markdown
  - - tokenize و BM25
    - 'BM25 سه ایده دارد: تکرار کلمه (با اشباع k1)، نادر بودن کلمه (idf) و نرمال‌سازی طول (b). `scores` برای هر سند جمع امتیاز کلمه‌های query را می‌دهد؛ `search` صفرها را حذف می‌کند.'
    - p01_faq_search/step02_bm25
  - - trigrams و trigram_search
    - هر کلمه به سه‌حرفی‌های هم‌پوشان شکسته می‌شود و شباهت Jaccard حساب می‌شود؛ یک غلط تایپی فقط چند سه‌حرفی را خراب می‌کند.
    - p01_faq_search/step04_hybrid_rrf
  - - rrf و Searcher
    - RRF فقط رتبه‌ها را جمع می‌کند (1/(60+rank))، پس مقیاس متفاوت امتیاز BM25 و Jaccard مهم نیست. Searcher هر سه روش را پشت یک تابع `search` می‌گذارد.
    - p01_faq_search/step04_hybrid_rrf
  - - recall_at_k، reciprocal_rank، evaluate
    - 'recall@k: سند درست در k نتیجه‌ی اول هست؟ MRR: چقدر بالا؟ `evaluate` سؤال‌های بی‌جواب را کنار می‌گذارد و سندهای تکراری را یکی می‌کند.'
    - p01_faq_search/step03_metrics
  - - build_messages، extract_citations، answer
    - prompt منبع‌ها را با شناسه می‌دهد؛ ارجاع‌ها با شناسه‌های واقعی فیلتر می‌شوند؛ بدون شاهد یا بدون ارجاع معتبر = امتناع. دفاع در کد است، نه در prompt.
    - p01_faq_search/step05_answer_citations
  - - make_llm
    - 'یک رابط برای همه‌ی مدل‌ها: تابعی که پیام‌ها را می‌گیرد و متن برمی‌گرداند. offline بدون مدل، Ollama محلی، Claude با کلید API، OpenCode با `opencode run`.'
    - m01_compare_models/step01_provider_config
- title: فایل check_setup.py
  where:
  - gh
  minutes: 2
  why: یک بررسی کوچک که بعد از نصب روی لپ‌تاپ اجرا می‌کنی تا مطمئن شوی پایتون، داده و توابع اصلی کار می‌کنند، قبل از notebook.
  do:
  - '**Add file → Create new file**، نام `check_setup.py`. commit: `Add setup check`.'
  file: check_setup.py
- title: 'تست‌ها: tests/test_faq_search.py'
  where:
  - gh
  minutes: 3
  why: 'تست خودکار یعنی هر تغییری بعداً خرابی را فوراً نشان می‌دهد. برای کارفرما هم نشانه‌ی مهندسی جدی است. این تست‌ها به هیچ مدلی نیاز ندارند: به‌جای مدل یک تابع ساختگی می‌دهیم.'
  do:
  - '**Add file → Create new file**، نام `tests/test_faq_search.py`. commit: `Add tests`.'
  file: tests/test_faq_search.py
- title: تست خودکار در GitHub (Actions)
  where:
  - gh
  minutes: 3
  why: با هر push، GitHub خودش تست‌ها را روی یک ماشین تمیز اجرا می‌کند. تیک سبز کنار commit ها یعنی پروژه روی هر سیستمی کار می‌کند، نه فقط لپ‌تاپ تو.
  do:
  - '**Add file → Create new file**، نام `.github/workflows/tests.yml`. commit: `Add CI`.'
  - به تب **Actions** برو و چند ثانیه صبر کن.
  file: .github/workflows/tests.yml
  see: 'در تب Actions یک اجرای `tests` با تیک سبز. اگر قرمز شد، رویش کلیک کن: خطا دقیقاً می‌گوید کدام فایل یا خط.'
- title: آوردن repo به لپ‌تاپ و ساختن محیط پایتون
  where:
  - vs
  minutes: 8
  why: محیط مجازی (venv) یک پایتون جدا فقط برای این پروژه است تا بسته‌هایش با پروژه‌های دیگر قاطی نشوند.
  pre: 'پیش‌نیاز: Git (از git-scm.com) و Python 3.10 یا جدیدتر، و در VS Code افزونه‌های **Python** و **Jupyter** از Microsoft.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Git: Clone** → آدرس `https://github.com/<نام-کاربری-تو>/faq_search.git` → یک پوشه انتخاب کن → **Open**.'
  - 'ترمینال را باز کن: ``Ctrl+` ``'
  commands:
  - label: ترمینال VS Code · Windows PowerShell
    code: 'python -m venv .venv

      .venv\Scripts\Activate.ps1

      pip install -r requirements.txt

      '
  - label: ترمینال VS Code
    code: 'python check_setup.py

      python -m pytest -q

      '
    output:
    - check_setup
    - pytest
    expect: setup ok|\d+ passed
  warn: 'اگر PowerShell گفت running scripts is disabled: یک بار `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` و دوباره فعال کن. روی Mac/Linux به‌جای خط دوم: `source .venv/bin/activate`.'
- title: ساختن و اجرای notebook
  where:
  - vs
  minutes: 15
  why: 'notebook داستان پروژه است: داده، روش‌ها، مقایسه با عدد، و جواب‌ها. کسی که repo را در GitHub باز می‌کند، از همین notebook (با خروجی‌هایش) می‌فهمد چه کرده‌ای.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Create: New Jupyter Notebook** → `Ctrl+S` با نام `01_faq_search.ipynb` در پوشه‌ی repo.'
  - بالا سمت راست **Select Kernel → Python Environments → .venv**.
  - 'سلول‌ها را به ترتیب زیر بساز (متن: **+ Markdown**، کد: **+ Code**) و هر سلول کد را با `Shift+Enter` اجرا کن. خروجی را با «باید ببینی» زیرش مقایسه کن.'
  tip: 'اگر نمی‌خواهی سلول‌ها را یکی‌یکی بسازی: دکمه‌ی **دانلود notebook** پایین همین مرحله فایل آماده را می‌دهد؛ آن را در پوشه‌ی repo بگذار و همه‌ی سلول‌ها را اجرا کن (Run All). ولی یک بار دستی ساختن، کد را بهتر در ذهنت می‌نشاند.'
  notebook: 01_faq_search.ipynb
- title: اجرا با مدل زبانی واقعی (اختیاری)
  where:
  - vs
  - ol
  minutes: 10
  why: مدل `offline` فقط اولین منبع را با شناسه‌اش برمی‌گرداند تا ساختار را ببینی. با مدل واقعی می‌بینی جواب چطور نوشته می‌شود و آیا ارجاع‌ها را رعایت می‌کند.
  do:
  - یکی از سه راه را انتخاب کن و در ترمینال VS Code اجرا کن، بعد سلول «جواب‌ها» در notebook را دوباره اجرا کن (اول **Restart** kernel تا متغیر محیطی خوانده شود).
  commands:
  - label: Ollama (محلی، رایگان) · از ollama.com نصب کن
    code: 'ollama pull qwen2.5:7b

      pip install ollama

      $env:FAQ_PROVIDER = "ollama"

      '
  - label: Claude (کلید API از console.anthropic.com؛ اشتراک Claude.ai کلید API نیست)
    code: 'pip install anthropic

      $env:ANTHROPIC_API_KEY = "sk-ant-..."     # فقط در ترمینال؛ هرگز در فایل یا notebook

      $env:FAQ_PROVIDER = "anthropic"

      '
  - label: OpenCode (اگر نصب داری و وارد یک provider شده‌ای)
    code: 'opencode models

      $env:FAQ_PROVIDER = "opencode"

      '
  warn: کلید API را هرگز در notebook یا فایل‌های repo ننویس. اگر اشتباهاً push شد، فوراً در Console باطلش کن؛ پاک کردن commit کافی نیست. در Mac/Linux به‌جای `$env:X = "y"` بنویس `export X=y`.
- title: commit و push از VS Code
  where:
  - vs
  - gh
  minutes: 3
  why: notebook با خروجی‌هایش و فایل نتایج باید در GitHub باشند تا بدون اجرا دیده شوند.
  do:
  - 'پنل Source Control: `Ctrl+Shift+G`. فایل‌های `01_faq_search.ipynb` و `results/results.json` را می‌بینی.'
  - 'پیام: `Add notebook with search comparison and grounded answers` → **Commit** → **Sync Changes**.'
  see: 'در GitHub، `01_faq_search.ipynb` را باز کن: جدول‌ها و خروجی‌ها بدون اجرا دیده می‌شوند. تب Actions دوباره سبز است.'
  warn: 'قانون ساده: قبل از هر کار در VS Code اول **Pull** بزن، و یک فایل را هم‌زمان در GitHub و VS Code ویرایش نکن.'
- title: README نهایی
  where:
  - gh
  minutes: 10
  why: 'README صفحه‌ی اول پروژه است. باید در ۳۰ ثانیه بگوید: چه مسئله‌ای، چه روشی، چه عددی، و محدودیت‌ها چیست. عددها را از `results/results.json` خودت بردار، نه از این صفحه.'
  do:
  - 'در GitHub روی `README.md` → آیکون مداد → همه‌ی متن را با متن زیر عوض کن و عددهای داخل `{...}` را با عددهای خودت پر کن. commit: `Write README`.'
  - نام کاربری‌ات را در خط badge جایگزین کن.
  readme: true
- title: صیقل نهایی repo
  where:
  - gh
  minutes: 5
  why: جزئیات کوچکی که repo را حرفه‌ای نشان می‌دهد.
  do:
  - 'صفحه‌ی repo → آیکون چرخ‌دنده کنار **About** → Topics: `information-retrieval`, `bm25`, `rag`, `llm`, `python`.'
  - 'در پروفایل GitHub: **Customize your pins** → این repo را pin کن.'
  - یک خط رزومه از جدول نتایج بنویس (پایین همین مرحله).
  cv: Built an FAQ search engine from scratch (markdown chunking, BM25, typo-tolerant trigram search fused with RRF) with recall@3 {recall} / MRR {mrr} on labelled questions, and LLM answers that cite their sources or abstain; tested with pytest and GitHub Actions.
trouble:
- - '`python` شناخته نمی‌شود'
  - Python را با تیک «Add to PATH» نصب کن، یا به‌جای `python` بنویس `py`.
- - '`No module named faq_search` در notebook'
  - notebook باید در همان پوشه‌ی `faq_search.py` باشد و kernel روی `.venv` باشد (بالا سمت راست).
- - '`FileNotFoundError: data/faq.json`'
  - فایل داده را در مرحله‌ی ۴ با مسیر دقیق `data/faq.json` ساخته‌ای؟ notebook را از پوشه‌ی repo اجرا کن.
- - تب Actions قرمز است
  - روی اجرای قرمز کلیک کن؛ معمولاً یک فایل با نام یا مسیر اشتباه ساخته شده (مثلاً `test/` به‌جای `tests/`).
- - '`ConnectionError` با Ollama'
  - Ollama را اجرا کن (آیکونش کنار ساعت) و `ollama list` را بزن.
- - Claude خطای 401 می‌دهد
  - کلید API اشتباه یا تمام شده؛ اشتراک Claude.ai کلید API نیست.
