id: p03_document_qa
title: ساختن پرسش‌وپاسخ روی اسناد شرکت با ارجاع، از صفر در GitHub
repo: document_qa
description: 'Q&A over company documents (markdown, text, HTML, optional PDF/Word): heading-aware chunking, BM25, cited answers, number grounding and abstention'
lede: دستیاری می‌سازی که سؤال‌های کارمندان را از روی سندهای داخلی (چند قالب فایل) جواب می‌دهد، به بخش درست سند ارجاع می‌دهد، هر عدد جواب را با سند چک می‌کند و وقتی سند چیزی نمی‌گوید امتناع می‌کند. بدون GPU و بدون مدل؛ مدل واقعی اختیاری است. بهتر است اول p01 را ساخته باشی.
learn:
- - پروژه در نقشه‌ی راه
  - roadmap:p03_document_qa
- - 'جواب با ارجاع و امتناع: درس p01 گام ۵'
  - lesson:p01_faq_search
- - 'نسخه‌ی پیشرفته: Agentic RAG'
  - guide:p22_agentic_rag
lesson: ''
fill:
  correct: offline/correct_source
  wrong: offline/wrong_source
  wrong_abstain: offline/abstained_wrongly
  right_abstain: offline/abstained_correctly
  unanswerable: offline/answered_unanswerable
facts:
- - GitHub
  - فایل‌ها و تست خودکار
- - VS Code + notebook
  - اجرا روی لپ‌تاپ
- - مدل زبانی
  - 'اختیاری: Ollama، Claude یا OpenCode'
flow:
- - GitHub
  - gh
- - VS Code + notebook
  - vs
- - Ollama / Claude / OpenCode
  - ol
steps:
- title: ساختن repo در GitHub
  where:
  - gh
  minutes: 3
  why: 'repo خودت نمونه‌کار توست: هر فایلی که اینجا می‌سازی، کارفرما می‌بیند. اسم و توضیح کوتاه و دقیق، اولین چیزی است که دیده می‌شود.'
  do:
  - در github.com بالا سمت راست **+** → **New repository**.
  - '**Repository name:** `document_qa`'
  - '**Description:** `{description}`'
  - '**Public** را انتخاب کن (برای نمونه‌کار و Actions رایگان).'
  - تیک **Add a README file**، **Add .gitignore:** None (خودمان می‌سازیم)، **Choose a license:** MIT License → **Create repository**.
  see: 'repo دو فایل دارد: `README.md` و `LICENSE`. در LICENSE اگر نام تو در خط Copyright نیست، با آیکون مداد اصلاحش کن.'
- title: فایل .gitignore
  where:
  - gh
  minutes: 2
  why: 'به git می‌گوید چه چیزهایی هرگز وارد repo نشوند: محیط مجازی، فایل‌های موقت، و `.env` که کلید API در آن است. **قبل از** هر فایل دیگری بساز.'
  do:
  - '**Add file** → **Create new file**، نام `.gitignore`، متن زیر را paste کن. commit: `Add .gitignore`.'
  file: .gitignore
- title: فایل requirements.txt
  where:
  - gh
  minutes: 2
  why: هسته فقط کتابخانه‌ی استاندارد پایتون است (خواندن HTML هم با `html.parser` داخلی). `pypdf` و `python-docx` برای PDF و Word اختیاری‌اند؛ اگر سند PDF داری از حالت `#` درشان بیاور.
  do:
  - '**Add file → Create new file**، نام `requirements.txt`. commit: `Add requirements`.'
  file: requirements.txt
- title: 'سندها: docs/employee_handbook.md'
  where:
  - gh
  minutes: 2
  why: 'چهار سند داخلی در سه قالب: markdown، HTML و متن ساده. این واقعی‌تر از یک قالب است: در شرکت‌ها سندها همیشه قالب‌های مختلف دارند و هر کدام باید به یک شکل یکسان (متن با عنوان) تبدیل شود.'
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `docs/employee_handbook.md` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add employee handbook`.'
  file: docs/employee_handbook.md
- title: 'سند HTML: docs/it_security.html'
  where:
  - gh
  minutes: 2
  why: یک صفحه‌ی intranet. عنوان‌های `<h1>` و `<h2>` به `#` و `##` تبدیل می‌شوند تا ساختار بخش‌ها حفظ شود.
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `docs/it_security.html` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add IT security policy (HTML)`.'
  file: docs/it_security.html
- title: 'سند متنی: docs/travel_policy.txt'
  where:
  - gh
  minutes: 2
  why: متن ساده بدون علامت‌گذاری؛ کد خط‌های کوتاهی را که متن بعدشان می‌آید عنوان در نظر می‌گیرد.
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `docs/travel_policy.txt` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add travel policy (plain text)`.'
  file: docs/travel_policy.txt
- title: 'سند: docs/expenses.md'
  where:
  - gh
  minutes: 2
  why: 'سند چهارم: هزینه‌ها و بازپرداخت، با عددهایی که نگهبان عدد باید چک کند.'
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `docs/expenses.md` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add expenses policy`.'
  file: docs/expenses.md
- title: 'سؤال‌ها: docs/questions.json'
  where:
  - gh
  minutes: 2
  why: ۱۸ سؤال کارمند با سند درست هر کدام؛ ۳ سؤال عمداً درباره‌ی چیزی است که در سندها نیست (مرخصی والدین، سگ در دفتر، سهام). سیستم باید آن‌ها را امتناع کند.
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `docs/questions.json` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add labelled questions`.'
  file: docs/questions.json
- title: 'فایل اصلی: doc_qa.py'
  where:
  - gh
  minutes: 5
  why: 'همه‌ی منطق در یک فایل: خواندن قالب‌های مختلف، تکه‌کردن با حفظ عنوان و پنجره‌ی هم‌پوشان برای بخش‌های بلند، BM25، بررسی کافی بودن شاهد، جواب با ارجاع، و دو نگهبان در کد: ارجاع باید واقعی باشد و هر عدد جواب باید در متن ارجاع‌شده باشد.'
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `doc_qa.py`. commit: `Add document Q&A: loaders, chunking, BM25, cited answers, number grounding`.'
  file: doc_qa.py
  note: 'مدل با متغیر محیطی `DOCQA_PROVIDER` انتخاب می‌شود: `offline` (پیش‌فرض)، `ollama`، `anthropic` یا `opencode`.'
  explain:
  - - _HTMLText و text_headings
    - هر قالب به متن با عنوان `#`/`##` تبدیل می‌شود تا تکه‌کردن برای همه یکسان باشد.
    - ''
  - - load_documents
    - md، txt و html با کتابخانه‌ی استاندارد؛ pdf و docx فقط اگر بسته‌اش نصب باشد.
    - ''
  - - chunk
    - یک تکه برای هر بخش؛ بخش بلند به پنجره‌های ۸۰ کلمه‌ای با ۲۰ کلمه هم‌پوشانی، تا جمله‌ای که مرز را رد می‌کند گم نشود.
    - p01_faq_search/step01_chunk_markdown
  - - BM25 و enough_evidence
    - 'BM25 با ریشه‌یابی ساده؛ بعد شرط شاهد: نصف کلمه‌های سؤال باید در تکه باشد، وگرنه امتناع.'
    - p22_agentic_rag/step02_grader
  - - numbers_grounded
    - هر عدد جواب باید در متن ارجاع‌شده باشد. عدد اشتباه پرهزینه‌ترین خطای این نوع سیستم است.
    - ''
  - - answer و evaluate
    - جست‌وجو، شاهد، جواب، ارجاع واقعی، عدد درست؛ اگر هر کدام نشد امتناع با دلیل. evaluate منبع درست و امتناع درست را می‌شمارد.
    - p01_faq_search/step05_answer_citations
- title: فایل check_setup.py
  where:
  - gh
  minutes: 2
  why: یک بررسی کوچک که بعد از نصب روی لپ‌تاپ اجرا می‌کنی تا مطمئن شوی پایتون، داده و توابع اصلی کار می‌کنند، قبل از notebook.
  do:
  - '**Add file → Create new file**، نام `check_setup.py`. commit: `Add setup check`.'
  file: check_setup.py
- title: 'تست‌ها: tests/test_doc_qa.py'
  where:
  - gh
  minutes: 3
  why: تست‌ها چک می‌کنند هر سه قالب با عنوان خوانده شوند، پنجره‌ها هم‌پوشان باشند، عدد ساختگی و ارجاع ساختگی رد شوند، و روی مجموعه‌ی سؤال‌ها هیچ سؤال بی‌جوابی جواب نگیرد.
  do:
  - '**Add file → Create new file**، نام `tests/test_doc_qa.py`. commit: `Add tests`.'
  file: tests/test_doc_qa.py
- title: تست خودکار در GitHub (Actions)
  where:
  - gh
  minutes: 3
  why: با هر push، GitHub تست‌ها را روی یک ماشین تمیز اجرا می‌کند. تیک سبز یعنی پروژه روی هر سیستمی کار می‌کند، نه فقط لپ‌تاپ تو.
  do:
  - '**Add file → Create new file**، نام `.github/workflows/tests.yml`. commit: `Add CI`.'
  - به تب **Actions** برو و چند ثانیه صبر کن.
  file: .github/workflows/tests.yml
  see: 'در تب Actions یک اجرای `tests` با تیک سبز. اگر قرمز شد، رویش کلیک کن: خطا دقیقاً می‌گوید کدام فایل یا خط.'
- title: آوردن repo به لپ‌تاپ و ساختن محیط پایتون
  where:
  - vs
  minutes: 8
  why: محیط مجازی (venv) یک پایتون جدا فقط برای این پروژه است تا بسته‌هایش با پروژه‌های دیگر قاطی نشوند.
  pre: 'پیش‌نیاز: Git (از git-scm.com) و Python 3.10 یا جدیدتر، و در VS Code افزونه‌های **Python** و **Jupyter** از Microsoft.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Git: Clone** → آدرس `https://github.com/<نام-کاربری-تو>/document_qa.git` → یک پوشه انتخاب کن → **Open**.'
  - 'ترمینال را باز کن: ``Ctrl+` ``'
  commands:
  - label: ترمینال VS Code · Windows PowerShell
    code: 'python -m venv .venv

      .venv\Scripts\Activate.ps1

      pip install -r requirements.txt

      '
  - label: ترمینال VS Code
    code: 'python check_setup.py

      python -m pytest -q

      '
    output:
    - check_setup
    - pytest
    expect: setup ok|\d+ passed
  warn: 'اگر PowerShell گفت running scripts is disabled: یک بار `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` و دوباره فعال کن. روی Mac/Linux به‌جای خط دوم: `source .venv/bin/activate`.'
- title: ساختن و اجرای notebook
  where:
  - vs
  minutes: 15
  why: 'notebook داستان پروژه است: قالب‌های مختلف، تکه‌ها، جواب‌ها با ارجاع، نمایش دو نگهبان (عدد اشتباه و ارجاع ساختگی) و ارزیابی.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Create: New Jupyter Notebook** → `Ctrl+S` با نام `01_document_qa.ipynb` در پوشه‌ی repo.'
  - بالا سمت راست **Select Kernel → Python Environments → .venv**.
  - 'سلول‌ها را به ترتیب زیر بساز (متن: **+ Markdown**، کد: **+ Code**) و هر سلول کد را با `Shift+Enter` اجرا کن. خروجی را با «باید ببینی» زیرش مقایسه کن.'
  tip: 'اگر نمی‌خواهی سلول‌ها را یکی‌یکی بسازی: دکمه‌ی **دانلود notebook** بالای سلول‌ها فایل آماده را می‌دهد؛ در پوشه‌ی repo بگذار و Run All. ولی یک بار دستی ساختن، کد را بهتر در ذهنت می‌نشاند.'
  notebook: 01_document_qa.ipynb
- title: اجرا با مدل زبانی واقعی (اختیاری)
  where:
  - vs
  - ol
  minutes: 10
  why: مدل offline جمله را از سند برمی‌دارد. با مدل واقعی جواب روان‌تر است، ولی همان دو نگهبان باید جواب مدل را چک کنند؛ ببین چند بار جواب مدل رد می‌شود.
  do:
  - یکی از سه راه را در ترمینال VS Code اجرا کن، بعد kernel را **Restart** و سلول «With a real model» را اجرا کن.
  commands:
  - label: Ollama (محلی، رایگان) · از ollama.com نصب کن
    code: 'ollama pull qwen2.5:7b

      pip install ollama

      $env:DOCQA_PROVIDER = "ollama"

      '
  - label: Claude (کلید API از console.anthropic.com؛ اشتراک Claude.ai کلید API نیست)
    code: 'pip install anthropic

      $env:ANTHROPIC_API_KEY = "sk-ant-..."     # فقط در ترمینال

      $env:DOCQA_PROVIDER = "anthropic"

      '
  - label: OpenCode
    code: 'opencode models

      $env:DOCQA_PROVIDER = "opencode"

      '
  warn: کلید API را هرگز در notebook یا فایل‌های repo ننویس. سندهای واقعی شرکت را به مدل ابری نفرست مگر اجازه داشته باشی؛ برای سند محرمانه Ollama محلی را انتخاب کن.
- title: commit و push از VS Code
  where:
  - vs
  - gh
  minutes: 3
  why: notebook با خروجی‌هایش و فایل نتایج باید در GitHub باشند تا بدون اجرا دیده شوند.
  do:
  - 'پنل Source Control: `Ctrl+Shift+G`. فایل‌های `01_document_qa.ipynb` و `results/results.json` را می‌بینی.'
  - 'پیام: `Add notebook: document Q&A with citations and guards` → **Commit** → **Sync Changes**.'
  see: 'در GitHub، `01_document_qa.ipynb` را باز کن: جدول‌ها و خروجی‌ها بدون اجرا دیده می‌شوند. تب Actions دوباره سبز است.'
  warn: 'قانون ساده: قبل از هر کار در VS Code اول **Pull** بزن، و یک فایل را هم‌زمان در GitHub و VS Code ویرایش نکن.'
- title: README نهایی
  where:
  - gh
  minutes: 10
  why: 'README صفحه‌ی اول پروژه است: در ۳۰ ثانیه بگوید چه مسئله‌ای، چه روشی، چه عددی و چه محدودیتی. عددها را از `results/results.json` خودت بردار، نه از این صفحه.'
  do:
  - 'در GitHub روی `README.md` → آیکون مداد → متن زیر را جایگزین کن و عددهای `{...}` را پر کن (یا results.json را پایین paste کن). commit: `Write README`.'
  - نام کاربری‌ات را در خط badge جایگزین کن.
  readme: true
- title: صیقل نهایی repo
  where:
  - gh
  minutes: 5
  why: جزئیات کوچکی که repo را حرفه‌ای نشان می‌دهد.
  do:
  - 'صفحه‌ی repo → چرخ‌دنده‌ی **About** → Topics: `rag`, `document-qa`, `retrieval`, `llm`, `python`.'
  - 'در پروفایل GitHub: **Customize your pins** → این repo را pin کن.'
  - خط رزومه‌ی پایین را با عددهای خودت بردار.
  cv: Built a document Q&A assistant over multi-format company policies (md/txt/html, optional pdf/docx) with heading-aware chunking, BM25, cited answers and code-level guards (citation and number grounding); {correct}/15 answerable questions answered from the right source and {right_abstain}/3 out-of-scope questions abstained.
trouble:
- - '`No module named doc_qa` در notebook'
  - notebook باید کنار `doc_qa.py` باشد و kernel روی `.venv`.
- - '`FileNotFoundError: docs`'
  - سندها را در پوشه‌ی `docs/` ساخته‌ای؟ notebook را از پوشه‌ی repo اجرا کن.
- - سند PDF من خوانده نمی‌شود
  - '`pip install pypdf`؛ PDF اسکن‌شده متن ندارد و OCR لازم دارد.'
- - '`python` شناخته نمی‌شود'
  - Python را با تیک «Add to PATH» نصب کن، یا به‌جای `python` بنویس `py`.
- - تب Actions قرمز است
  - روی اجرای قرمز کلیک کن؛ معمولاً یک فایل با نام یا مسیر اشتباه ساخته شده (مثلاً `test/` به‌جای `tests/`).
