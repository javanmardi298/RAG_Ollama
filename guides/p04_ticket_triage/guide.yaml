id: p04_ticket_triage
title: ساختن طبقه‌بندی و مسیریابی تیکت با ارجاع به انسان، از صفر در GitHub
repo: ticket_triage
description: 'Support-ticket triage: TF-IDF + logistic regression with a leakage-free split, temperature calibration and a confidence threshold that sends uncertain tickets to a human'
lede: 'تیکت‌های پشتیبانی را به ۶ دسته تقسیم می‌کنی و فقط وقتی مدل به اندازه‌ی کافی مطمئن است تیکت را خودکار مسیریابی می‌کنی؛ بقیه به انسان می‌روند. سه درس مهم با عدد: نشت داده (leakage) با تقسیم تصادفی، کالیبراسیون اطمینان، و اینکه مدل گاهی روی اشتباهش مطمئن است. بدون GPU؛ مدل زبانی اختیاری برای مقایسه.'
learn:
- - پروژه در نقشه‌ی راه
  - roadmap:p04_ticket_triage
- - 'مقایسه‌ی مدل‌ها با عدد: درس m01'
  - lesson:m01_compare_models
lesson: ''
fill:
  acc: test/accuracy
  f1: test/macro_f1
  leaky_acc: leaky_random_split/accuracy
  leaky_f1: leaky_random_split/macro_f1
  cov80: routing/0.8/test/coverage
  acc80: routing/0.8/test/accuracy_automated
facts:
- - GitHub
  - فایل‌ها و تست خودکار
- - VS Code + notebook
  - scikit-learn روی لپ‌تاپ
- - مدل زبانی
  - اختیاری برای مقایسه
flow:
- - GitHub
  - gh
- - VS Code + notebook
  - vs
- - Ollama / Claude / OpenCode
  - ol
steps:
- title: ساختن repo در GitHub
  where:
  - gh
  minutes: 3
  why: 'repo خودت نمونه‌کار توست: هر فایلی که اینجا می‌سازی، کارفرما می‌بیند. اسم و توضیح کوتاه و دقیق، اولین چیزی است که دیده می‌شود.'
  do:
  - در github.com بالا سمت راست **+** → **New repository**.
  - '**Repository name:** `ticket_triage`'
  - '**Description:** `{description}`'
  - '**Public** را انتخاب کن (برای نمونه‌کار و Actions رایگان).'
  - تیک **Add a README file**، **Add .gitignore:** None (خودمان می‌سازیم)، **Choose a license:** MIT License → **Create repository**.
  see: 'repo دو فایل دارد: `README.md` و `LICENSE`. در LICENSE اگر نام تو در خط Copyright نیست، با آیکون مداد اصلاحش کن.'
- title: فایل .gitignore
  where:
  - gh
  minutes: 2
  why: 'به git می‌گوید چه چیزهایی هرگز وارد repo نشوند: محیط مجازی، فایل‌های موقت، و `.env` که کلید API در آن است. **قبل از** هر فایل دیگری بساز.'
  do:
  - '**Add file** → **Create new file**، نام `.gitignore`، متن زیر را paste کن. commit: `Add .gitignore`.'
  file: .gitignore
- title: فایل requirements.txt
  where:
  - gh
  minutes: 2
  why: numpy و scikit-learn (TF-IDF، logistic regression، تقسیم گروهی). بسته‌های مدل زبانی اختیاری‌اند.
  do:
  - '**Add file → Create new file**، نام `requirements.txt`. commit: `Add requirements`.'
  file: requirements.txt
- title: 'فایل داده: data/tickets.json'
  where:
  - gh
  minutes: 3
  why: '۲۴۰ تیکت ساختگی در ۶ دسته. هر تیکت از یکی از ۶۰ «قالب جمله» ساخته شده (ستون `template`)، با کمی غلط تایپی. ستون template برای تقسیم درست لازم است: همان جمله‌بندی نباید هم در آموزش باشد و هم در آزمون.'
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `data/tickets.json` (با تایپ `/` خود GitHub پوشه را می‌سازد). commit: `Add synthetic support tickets`.'
  file: data/tickets.json
- title: 'فایل اصلی: triage.py'
  where:
  - gh
  minutes: 5
  why: 'همه‌ی منطق در یک فایل: تقسیم بر اساس قالب (و تقسیم تصادفی برای مقایسه)، مدل TF-IDF کلمه‌ای و حرفی + logistic regression، اطمینان با temperature، ECE، انتخاب آستانه روی dev برای دقت هدف، coverage و دقت تیکت‌های خودکار، و طبقه‌بند مدل زبانی اختیاری.'
  do:
  - '**Add file → Create new file**، در کادر نام بنویس `triage.py`. commit: `Add triage: leakage-free split, TF-IDF classifier, calibration, human fallback`.'
  file: triage.py
  note: 'مدل زبانی برای مقایسه با `TRIAGE_PROVIDER` انتخاب می‌شود: `ollama`، `anthropic` یا `opencode`.'
  explain:
  - - split و random_split
    - تقسیم بر اساس قالب جمله (GroupShuffleSplit) تا همان جمله‌بندی در دو طرف نباشد؛ random_split نسخه‌ی نشت‌دار برای مقایسه است.
    - ''
  - - train
    - TF-IDF کلمه‌ای (۱ و ۲ کلمه) + حرفی (۲ تا ۴ حرف، برای غلط تایپی) و logistic regression. حرفی‌ها همان چیزی‌اند که delayed را شبیه damaged می‌کنند.
    - ''
  - - predict، ece، fit_temperature
    - softmax روی امتیازها تقسیم بر temperature. ECE فاصله‌ی اطمینان با دقت واقعی است. temperature روی dev انتخاب می‌شود.
    - ''
  - - choose_threshold و selective
    - تیکت‌ها از مطمئن‌ترین مرتب می‌شوند؛ پایین‌ترین آستانه‌ای که دقت تیکت‌های خودکار هنوز به هدف می‌رسد. coverage = سهم خودکار؛ بقیه به انسان.
    - ''
  - - llm_classifier
    - 'اختیاری: همان کار بدون آموزش با Ollama، Claude یا OpenCode، برای مقایسه.'
    - ''
- title: فایل check_setup.py
  where:
  - gh
  minutes: 2
  why: یک بررسی کوچک که بعد از نصب روی لپ‌تاپ اجرا می‌کنی تا مطمئن شوی پایتون، داده و توابع اصلی کار می‌کنند، قبل از notebook.
  do:
  - '**Add file → Create new file**، نام `check_setup.py`. commit: `Add setup check`.'
  file: check_setup.py
- title: 'تست‌ها: tests/test_triage.py'
  where:
  - gh
  minutes: 3
  why: تست‌ها چک می‌کنند هیچ قالبی دو جا نباشد، تقسیم تصادفی نتیجه‌ی بهتری (گول‌زننده) نشان دهد، ECE و انتخاب آستانه درست حساب شوند، و مدل یاد بگیرد.
  do:
  - '**Add file → Create new file**، نام `tests/test_triage.py`. commit: `Add tests`.'
  file: tests/test_triage.py
- title: تست خودکار در GitHub (Actions)
  where:
  - gh
  minutes: 3
  why: با هر push، GitHub تست‌ها را روی یک ماشین تمیز اجرا می‌کند. تیک سبز یعنی پروژه روی هر سیستمی کار می‌کند، نه فقط لپ‌تاپ تو.
  do:
  - '**Add file → Create new file**، نام `.github/workflows/tests.yml`. commit: `Add CI`.'
  - به تب **Actions** برو و چند ثانیه صبر کن.
  file: .github/workflows/tests.yml
  see: 'در تب Actions یک اجرای `tests` با تیک سبز. اگر قرمز شد، رویش کلیک کن: خطا دقیقاً می‌گوید کدام فایل یا خط.'
- title: آوردن repo به لپ‌تاپ و ساختن محیط پایتون
  where:
  - vs
  minutes: 8
  why: محیط مجازی (venv) یک پایتون جدا فقط برای این پروژه است تا بسته‌هایش با پروژه‌های دیگر قاطی نشوند.
  pre: 'پیش‌نیاز: Git (از git-scm.com) و Python 3.10 یا جدیدتر، و در VS Code افزونه‌های **Python** و **Jupyter** از Microsoft.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Git: Clone** → آدرس `https://github.com/<نام-کاربری-تو>/ticket_triage.git` → یک پوشه انتخاب کن → **Open**.'
  - 'ترمینال را باز کن: ``Ctrl+` ``'
  commands:
  - label: ترمینال VS Code · Windows PowerShell
    code: 'python -m venv .venv

      .venv\Scripts\Activate.ps1

      pip install -r requirements.txt

      '
  - label: ترمینال VS Code
    code: 'python check_setup.py

      python -m pytest -q

      '
    output:
    - check_setup
    - pytest
    expect: setup ok|\d+ passed
  warn: 'اگر PowerShell گفت running scripts is disabled: یک بار `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` و دوباره فعال کن. روی Mac/Linux به‌جای خط دوم: `source .venv/bin/activate`.'
- title: ساختن و اجرای notebook
  where:
  - vs
  minutes: 15
  why: 'notebook داستان پروژه است: نشت داده با عدد، ماتریس اشتباه، کالیبراسیون، مطمئن‌ترین اشتباه‌ها و مسیریابی با ارجاع به انسان.'
  do:
  - 'VS Code: `Ctrl+Shift+P` → **Create: New Jupyter Notebook** → `Ctrl+S` با نام `01_ticket_triage.ipynb` در پوشه‌ی repo.'
  - بالا سمت راست **Select Kernel → Python Environments → .venv**.
  - 'سلول‌ها را به ترتیب زیر بساز (متن: **+ Markdown**، کد: **+ Code**) و هر سلول کد را با `Shift+Enter` اجرا کن. خروجی را با «باید ببینی» زیرش مقایسه کن.'
  tip: 'اگر نمی‌خواهی سلول‌ها را یکی‌یکی بسازی: دکمه‌ی **دانلود notebook** بالای سلول‌ها فایل آماده را می‌دهد؛ در پوشه‌ی repo بگذار و Run All. ولی یک بار دستی ساختن، کد را بهتر در ذهنت می‌نشاند.'
  notebook: 01_ticket_triage.ipynb
- title: مقایسه با مدل زبانی (اختیاری)
  where:
  - vs
  - ol
  minutes: 10
  why: مدل زبانی بدون آموزش معنا را می‌فهمد (delayed با damaged فرق دارد) ولی کندتر و برای ابری پولی است. با عدد مقایسه کن.
  do:
  - یکی از سه راه را در ترمینال VS Code اجرا کن، kernel را **Restart** و سلول آخر notebook را اجرا کن.
  commands:
  - label: Ollama (محلی، رایگان)
    code: 'ollama pull qwen2.5:7b

      pip install ollama

      $env:TRIAGE_PROVIDER = "ollama"

      '
  - label: Claude (کلید API؛ اشتراک Claude.ai کلید API نیست)
    code: 'pip install anthropic

      $env:ANTHROPIC_API_KEY = "sk-ant-..."

      $env:TRIAGE_PROVIDER = "anthropic"

      '
  - label: OpenCode
    code: 'opencode models

      $env:TRIAGE_PROVIDER = "opencode"

      '
  warn: کلید API را در notebook یا فایل‌های repo ننویس. تیکت واقعی مشتری را بدون اجازه به مدل ابری نفرست.
- title: commit و push از VS Code
  where:
  - vs
  - gh
  minutes: 3
  why: notebook با خروجی‌هایش و فایل نتایج باید در GitHub باشند تا بدون اجرا دیده شوند.
  do:
  - 'پنل Source Control: `Ctrl+Shift+G`. فایل‌های `01_ticket_triage.ipynb` و `results/results.json` را می‌بینی.'
  - 'پیام: `Add notebook: leakage, calibration and human fallback` → **Commit** → **Sync Changes**.'
  see: 'در GitHub، `01_ticket_triage.ipynb` را باز کن: جدول‌ها و خروجی‌ها بدون اجرا دیده می‌شوند. تب Actions دوباره سبز است.'
  warn: 'قانون ساده: قبل از هر کار در VS Code اول **Pull** بزن، و یک فایل را هم‌زمان در GitHub و VS Code ویرایش نکن.'
- title: README نهایی
  where:
  - gh
  minutes: 10
  why: 'README صفحه‌ی اول پروژه است: در ۳۰ ثانیه بگوید چه مسئله‌ای، چه روشی، چه عددی و چه محدودیتی. عددها را از `results/results.json` خودت بردار، نه از این صفحه.'
  do:
  - 'در GitHub روی `README.md` → آیکون مداد → متن زیر را جایگزین کن و عددهای `{...}` را پر کن (یا results.json را پایین paste کن). commit: `Write README`.'
  - نام کاربری‌ات را در خط badge جایگزین کن.
  readme: true
- title: صیقل نهایی repo
  where:
  - gh
  minutes: 5
  why: جزئیات کوچکی که repo را حرفه‌ای نشان می‌دهد.
  do:
  - 'صفحه‌ی repo → چرخ‌دنده‌ی **About** → Topics: `text-classification`, `calibration`, `scikit-learn`, `mlops`, `python`.'
  - 'در پروفایل GitHub: **Customize your pins** → این repo را pin کن.'
  - خط رزومه‌ی پایین را با عددهای خودت بردار.
  cv: Built a support-ticket triage model (TF-IDF + logistic regression) with a leakage-free split by wording template (accuracy {acc} vs a misleading {leaky_acc} on a random split), temperature calibration, and a dev-tuned confidence threshold that automates {cov80} of test tickets at {acc80} accuracy and sends the rest to a human.
trouble:
- - '`No module named triage` در notebook'
  - notebook باید کنار `triage.py` باشد و kernel روی `.venv`.
- - عددهای من کمی فرق دارد
  - نسخه‌ی scikit-learn می‌تواند عددها را کمی جابه‌جا کند؛ نتیجه‌ی کلی (نشت، اشتباه مطمئن) باید همان باشد.
- - '`python` شناخته نمی‌شود'
  - Python را با تیک «Add to PATH» نصب کن، یا به‌جای `python` بنویس `py`.
- - تب Actions قرمز است
  - روی اجرای قرمز کلیک کن؛ معمولاً یک فایل با نام یا مسیر اشتباه ساخته شده (مثلاً `test/` به‌جای `tests/`).
